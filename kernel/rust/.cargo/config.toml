# Pippin kernel crate build configuration.
#
# The Rust side builds as a `no_std` staticlib that CMake links into the
# final kernel ELF. The freestanding target avoids Linux userspace defaults.

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = ["-C", "code-model=large", "-C", "relocation-model=static"]
